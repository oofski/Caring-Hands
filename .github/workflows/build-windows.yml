name: Build Windows App

on:
  push:
    branches:
      - claude/confident-cori-tzj1sg
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned to windows-2022 (Visual Studio 2022). "windows-latest" rolled to a
    # newer image whose Visual Studio 18 isn't recognized by node-gyp, which
    # broke the native better-sqlite3 build during npm install.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer + portable exe
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        shell: bash
        run: ls -la release/ || dir release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Caring-Hands-Windows
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.25-build.${{ github.run_number }}
          name: Caring Hands v1.5.25 (build ${{ github.run_number }})
          prerelease: false
          make_latest: true
          body: |
            ## Caring Hands Worldwide — Practice Management Software (v1.5.25)

            Offline-first dental clinic app for Windows. **Download the installer once — it auto-updates from here on.**

            **New in v1.5.25 — vitals are now a hard requirement, and you can move patients back a stage**
            - **No patient reaches a treatment chair without vitals.** A blood pressure **or** pulse must be recorded at the vitals station before anyone can be sent to the dentist or the hygienist. The reading is what tells the dentist whether it is safe to give anaesthetic or extract, so this is now a real block rather than a habit — and it holds on **every** route, including an administrator override from the Management screen. The vitals station says so up front instead of only when you tap, and anything you have just typed into the vitals fields is saved automatically when you sign the patient off.
            - **Move a patient back to any earlier stage.** Under **Admin → Management**, every patient now has a **Check-in** button alongside the existing EMT / Dentist / Hygienist / Check-out moves. **Check-in** is the full rewind: the patient is no longer confirmed present, no longer signed off by the vitals station, and no longer assigned to a provider, so they reappear in the front desk's **Arrivals** list and go through the flow again from the top. It works from any stage — including pulling back someone who was already checked out.
            - **Their recorded vitals are kept** when you move them back. A blood pressure reading is a clinical fact, not a workflow step, so nothing measured is ever discarded — the patient simply needs to be walked through the stations again.

            **From v1.5.24 — consents must be signed, patients route themselves, and a front-desk arrival check**
            - **Pre-registration now requires a real signature.** Ticking the consent box is no longer enough — the patient must sign on their phone, and type their name, before the form will submit. If they chose an **extraction**, the **Oral Surgery consent must be signed too**; if they chose a cleaning or a filling, it is not asked for at all. This means a pre-registered patient arrives with consent genuinely on file, instead of the dentist discovering at the chair that it still needs capturing.
            - **What the patient needs now picks their station automatically.** A **cleaning** goes to the **hygienist**; a **filling or extraction** goes to the **dentist** — assigned from the patient's own answer at check-in, with no one having to choose. Staff can still override it at any time, and a patient who didn't answer is left for the vitals station to route as before.
            - **New "Arrivals" screen for the front desk.** Everyone who has checked in — at the desk or online, sometimes days earlier — waits here until someone confirms they are physically present. Tapping **"They're here — ready to go"** does three things at once: it marks them as arrived, it **double-checks every consent their visit needs is signed**, and it **confirms they have a station assigned**. If a consent is missing, it says so and refuses to send them through. Confirmed patients get a green **"Here"** tag on the live board, so the floor can tell who has actually walked in.
            - *The pre-registration signature requirement is delivered by the clinic server (now v1.6.0) — one more paste for your admin.*

            **From v1.5.23 — "Waiting for vitals" now counts pre-registered patients**
            - **Fixed: the dashboard's "Waiting for vitals" number ignored anyone who pre-registered online.** A clinic with 30 pre-registered patients sitting in the **Checked in** column could see a "Waiting for vitals" tile reading **1** — just the one walk-in registered at the desk. The tile was counting a record that only the in-person check-in creates, so patients who arrived through the pre-registration link were left out of the total. It now counts every patient who is checked in and hasn't had a blood pressure or pulse taken yet, so **the tile always matches the "Checked in" column on the board** and the vitals station's own queue. Nobody was ever missing from the vitals station itself — only the number on the dashboard was wrong.

            **From v1.5.22 — City & State are now required**
            - **City and State must be filled in to check a patient in.** Both fields are marked with a **\*** on the "About You" step and the front desk can't move to the next step until they're answered — so no patient reaches vitals without a town on file, and the Reports **"By city"** breakdown is complete for grant reporting.
            - **The online pre-registration link requires them too**, in both English and Spanish, so a patient can't submit the form without them.
            - *The pre-registration part is delivered by the clinic server (now v1.5.1). That one refresh also carries the v1.5.21 sync fix below, so your admin only needs to paste it once.*

            **From v1.5.21 — IMPORTANT sync fix: every computer now sees every patient**
            - **Fixed: patients showing on one computer but not another.** A patient could be checked in (or pre-registered online) and appear on one laptop while staying invisible on another — same clinic, same event, same version. Each station kept its place in the queue using a **clock time**, and any record that reached the cloud with an *earlier* time than the station had already passed was stepped over and **never delivered again**. Two everyday situations caused it: a check-in made while a laptop was **offline** (it keeps its original check-in time when it finally uploads), and a laptop whose **Windows clock was even slightly off**. Stations now track their place using a **counter kept by the clinic server** instead of a clock, so a record that arrives late is still delivered to every computer. Clock differences between laptops no longer matter.
            - **Every station repairs itself on this update.** The first time each computer runs v1.5.21 it re-reads the whole clinic from the cloud, so **patients that went missing earlier come back automatically**. No action needed — just let each laptop update and sync.
            - **New: Admin → Cloud → "Re-sync everything".** If a station ever looks out of step again, an admin can re-read the entire clinic from the cloud with one button. Nothing is deleted and nothing is duplicated.
            - *This fix needs the clinic's pre-registration/sync server refreshed too — the same one-time paste your admin has done before. Until it's refreshed, laptops keep working exactly as they do today.*

            **From v1.5.20 — City & State, required birthdate & gender, Spanish pre-registration, and smarter timers**
            - **City & State added to every patient.** The check-in form now asks for the patient's **City** and **State**, they print on the record and show on the chart, and the **Reports** tab has a new **"By city"** breakdown — so clinics that report to a city grant (e.g. Sandy, Oregon) can see how many patients came from that town. It's also collected on the online pre-registration form.
            - **Birthdate and gender are now required at check-in.** The front desk can't advance past the "About You" step until both are filled, so no patient reaches vitals without an age or gender on file. The online pre-registration link enforces the same.
            - **Spanish pre-registration.** The online pre-registration link now has a **Spanish version** — patients tap **"Español"** at the top (or open the link with `?lang=es`) and every question, the medical/dental history, and the **full consent** appear in Spanish, with the same consent signing. Their answers still arrive in English-coded form on the clinic screens.
            - **Pre-registered patients don't start the clock until they arrive.** Someone who pre-registers online — sometimes days ahead — no longer shows a runaway "total time" on the live board. Their **total time and time-at-stage only start once they're taken to Vitals**, so the board reflects real time in the clinic, not time since they filled the form.
            - *The Spanish pre-registration and the City/State + required fields on the online form are delivered by the pre-registration server: it needs the same one-time refresh your admin has done before (see the note your admin received).*

            **From v1.5.19 — resilient auto-update**
            - **The updater now retries automatically** when the update server returns a temporary error (GitHub occasionally returns a **504 Gateway Time-out** on release downloads). It backs off and tries several times, so a brief network hiccup no longer shows a scary failure or blocks the update.
            - If it genuinely can't reach the server after all retries, it now shows a **plain-language message** ("try again in a minute, or install the latest version manually") instead of a raw error.

            **From v1.5.18 — returning patients, a one-file clinic export, and a follow-up email list**
            - **Returning patients / multiple visits.** The dashboard has a new **Returning patient** button (front desk / registration): search by **name, phone, or date of birth**, tap **Start new visit**, and their details carry over — no re-typing a whole new patient. A person can have as many visits as they need.
            - **Export the whole clinic as one ZIP.** Under **Admin → Backup & export**, the new **Export clinic ZIP** button bundles the **full database + all records + a README** into a single `.zip` to drop onto a hard drive at the end of a clinic.
            - **Follow-up email list.** The **Reports** tab now lists every **checked-out patient who left an email**, with a one-click **Email** and **Copy all emails**, so you can send summaries a couple of days later. *(Emailing opens your mail app with a ready draft to attach the summary PDF; truly automatic delayed sending would need a mail service — ask your admin.)*
            - **X-rays in reports confirmed.** Patient X-ray images are included in both the full-record and summary PDFs.

            **From v1.5.17 — online pre-registration now mirrors the full check-in, with consent signing**
            - **Same questions as in person.** The pre-registration link now asks everything the in-person check-in does — the **full** allergy and medical-condition lists, medications, the extra medical history (under a physician's care, recent hospitalization, tobacco, pregnancy), dental history, and emergency contact.
            - **Patients can sign the consent forms on the link.** They read and sign the full **General consent** (required, the same wording used in person) and — when they choose an extraction — the **Oral Surgery consent** with tooth number(s). Signatures are captured by finger or stylus.
            - **The signed consent routes into the chart.** It arrives attached to the patient, so the dentist's "General consent required before treatment" is already satisfied for anyone who pre-registered — nothing to re-capture at the chair.
            - *This upgrade is delivered by the pre-registration server: it needs the same one-time refresh as before (now server v1.3.0 — see the note your admin received). The desktop app itself is unchanged from 1.5.16.*

            **From v1.5.16 — data-consistency fixes + live time tracking**
            - **Safety fix — "Bleeding disorder" now warns on the EMT & dentist screens.** A patient who reports a bleeding disorder at check-in already showed the blood-thinner alert in the queues and on the printed record, but the EMT and dentist detail screens were silent. Now all screens agree, so the two stations where an extraction is decided can't under-warn.
            - **Main record PDF now prints written-in answers.** The "Save record PDF" (full packet) now includes typed **"Other"** allergies/conditions (e.g. a hand-written **"Sulfa"** allergy), shows readable labels instead of raw codes, and prints **what the patient said they need** (extraction/filling/cleaning). It now matches the summary PDF.
            - **Records screen shows vitals + blood-thinner on screen.** The record now displays the reconciled blood-thinner status and the BP/vitals reading (with re-checks, in red if high) — previously those were only on the printout.
            - **Live time tracking on the board.** Every patient card now shows **two time tags** — **total time since check-in** and **time at the current stage** — and a green **"Left"** tag once they're checked out. The dashboard's last KPI tile now reads **"Checked out"** to match the board's final column.
            - **Pre-reg tag on the vitals queue.** Pre-registered patients are now tagged on the **EMT/Vitals** queue too (the arrival station), not just the dashboard board.
            - **Blood-thinner alert on the hygienist screen** (it can transfer a patient to the dentist for an extraction).
            - **Consistent wording** ("Checked out" everywhere, was "Dismissed" in a couple of spots) and a small Reports fix so a localized gender value isn't mislabeled.

            **From v1.5.15 — patients can pre-register online, ahead of time**
            - **A unique link per event.** Under **Admin → Events**, each event now has a **"Pre-reg link"** button. Share that link (text, email, or a printed QR code) and patients can fill out the check-in questions on their phone **before** they arrive.
            - **It routes straight into that event.** Anyone who submits from an event's link is added to **that** event's queue automatically — they appear in the **"Checked in"** column of the live board with a blue **"Pre-reg"** tag, and their answers (allergies, conditions, medications, reason for visit) show up on the EMT and dentist screens with no retyping.
            - **No new setup for most clinics** — it runs on the same clinic cloud you already sync with. *(One-time: the sync server needs its code refreshed to turn this on — see the note your admin received.)*
            - The link only works while the clinic is **Online** (Admin → Cloud), and a pre-registered patient can be dismissed like any other if they don't show.

            **From v1.5.14 — a live dashboard, a real reports dashboard, and more**
            - **Live patient-flow board on the dashboard.** The dashboard now shows a **live board** of where every patient physically is in the clinic — columns for **Checked in → Vitals → Ready for treatment → Hygienist → Dentist → Checked out** — with a card per patient (name, age, complaint, wait time, medical-flag and blood-thinner markers). It refreshes on its own, so anyone can glance at it and see the whole floor at a moment.
            - **Tap a number to jump there.** The top stat cards are now buttons — tap **Waiting for vitals** to open the vitals station, **Ready for treatment** to open the dentist, and so on. The old "Quick actions" strip is gone; the cards *are* the actions.
            - **Start check-in is front-and-center.** The **Start patient check-in** button now sits in the **top-right** of the dashboard. **Back up to USB** moved to **Admin → Backup & export** (where the export tools already live), keeping the dashboard clean.
            - **Reports is now a real analytics dashboard.** The Reports tab was redesigned: headline **KPI cards** (patients seen, completed, **X-rays uploaded**, extractions, fillings, cleanings), a **visit-completion ring**, a **patient demographics** breakdown (by **gender, age, and language**), a **procedures & imaging** breakdown, most-common conditions, and a per-day table. Everything is pulled live from the records; use the event selector to scope it, or **Export JSON** (admin).
            - **Health history:** added **Pain management program** and **Weight management program** as check-in condition checkboxes.

            **From v1.5.13 — a simple, reliable X-ray upload**
            - **One button: Add X-ray.** On the dentist's Treat screen, tap **Add X-ray** and pick the image (a **JPG** you exported from DEXIS). You can also drag the image straight onto the gallery.
            - **A clean center-screen form.** As soon as the image uploads, a form pops up in the middle of the screen with the picture and three simple choices:
              - **Tooth** — type the tooth number,
              - **Quadrant** — pick the area of the mouth, or
              - **General** — a full/other film.
            - **Auto-renames from your answer.** On **Save**, the X-ray is filed to the patient and named **`Lastname_Firstname_<your answer>.jpg`** (e.g. `Smith_John_T14.jpg`, `Smith_John_LL.jpg`, or `Smith_John_General.jpg`). It prints on the record and syncs to every laptop.
            - **Clears the loose file off the computer.** After it's saved to the chart, Caring Hands **deletes the original image file from the computer's drive**, so the export folder stays clean and the next patient's image is never mixed up with the last one.
            - **About DEXIS `.dex` files:** DEXIS saves its captures as a proprietary `.dex` file that Windows and web browsers can't display. Export it from DEXIS as a **JPG** first (DEXIS → Export/Save → JPEG), then upload that — this is the reliable path and takes a couple of clicks per image.

            **From v1.5.0 — X-rays in the patient chart**
            - The dentist's Treat screen has the **X-ray panel**: attach/label images, assign teeth, print on the record, and sync across laptops.

            **From v1.4.10 — check-in form updates**
            - **"What do you need today?" scale.** The dental step asks what the patient needs on a simple **1–4 slider** (slide or tap a number): **1 = Extraction (in pain), 2 = Extraction (no pain), 3 = Filling, 4 = Dental cleaning** — replacing the old yes/no "are you in pain?" question. Choosing **1 or 2 (extraction)** automatically adds the **Oral Surgery consent**, so it's captured whenever an extraction is expected. The choice shows on the dentist's chart and the record.
            - **Trimmed questions.** Removed **"Children by age group,"** **"Your long-term dental goals,"** and **"Interested in cosmetic improvements?"** from check-in — and from every screen and the printed record.
            - **Required answers.** **Medication allergies, medical conditions,** and **current medications** must now be answered at check-in (pick an option, "Other," or "None of the above" / "No medications") before the patient can continue.

            **From v1.4.8 — updated check-in allergy list**
            - The medication-allergy options at check-in now list **Lidocaine** and **Articaine** (the anesthetics actually used) instead of **Novocain**. Any older record that recorded a Novocain allergy still shows it — it's just no longer offered as a new choice.

            **From v1.4.7 — updated consent forms, chairside consent, and a few clinical fixes**
            - **Complete consent wording.** The General consent and the Oral Surgery consent now use the full, updated wording (the oral-surgery form includes the post-op / after-hours call instructions and hold-harmless). Read-aloud still works. Spanish and the other languages keep their existing translations; the new wording is the English authoritative text.
            - **Complete a consent at the dentist's chair.** The dentist's Treat screen now shows a **Consents** card right under patient history. If a patient wanted a filling but the dentist recommends an extraction, the dentist can have the patient complete the **Oral Surgery consent right there** — enter the tooth number(s), have the patient sign, done. (Also works for capturing a General consent if one is somehow missing.)
            - **General consent required before treatment.** The dentist can't document treatment until the General consent is on file. Every check-in already captures it, so nothing changes for normal visits; if it's ever missing, the Consents card lets the patient complete it first.
            - **Phone numbers accept up to 10 digits** (digits only) at check-in and when editing a record. It's a cap, not a required length, so shorter local numbers still work.
            - **High blood pressure — record re-checks.** When a reading is over 180/100, the vitals station lets you record **up to two more BP readings**. They show on the dentist's screen and print on the record (each in red if still high).

            **From v1.4.6 — the active event now syncs across laptops**
            - **Fix: setting the clinic event carries to every computer.** Choosing an event under **Admin → Events → Set active** used to only change *that* computer, so laptops could sit on different events and split the patient queue. Now the selection syncs: set the event on one laptop and every other laptop switches to the **same** event automatically, so new check-ins and the queue line up everywhere. If two people pick different events at once, the most recent choice wins on all laptops. (Turning an event off, or creating brand-new events, syncs the same way.)
            - Nothing to configure — just update every station and pick your event once.

            **From v1.4.5 — high blood pressure is flagged red**
            - A blood-pressure reading now turns **red** the moment it hits hypertensive-crisis levels — **systolic over 180 or diastolic over 100**. At the EMT/vitals station the offending field goes red as you type and a clear warning appears; the dentist's handoff strip and the printed record show the reading in red too. Exactly 180/100 is not flagged (only readings *over* the threshold are).

            **From v1.4.4 — staff accounts now sync across every laptop**
            - **Fix: your team syncs.** Staff accounts you create — including which event they're scoped to — used to live only on the laptop that created them. They now sync to **every** laptop on the clinic cloud, just like the patient queue. Create a dentist, hygienist, check-out, or registration account on one computer and they can sign in on all of them, with the same password and the same event scoping.
            - **One shared admin.** Every laptop ships with the same built-in `admin` account; those now converge to a single shared identity instead of colliding. If you set a real admin password on one laptop, that password propagates to the others — and a freshly-installed laptop's default `admin/admin` can never overwrite the password you already set.
            - To revoke someone across all laptops, **disable** their account (Admin → Staff → Disable) — that change syncs everywhere. (As with patient records, deleting on one laptop doesn't erase them elsewhere; disable is the reliable, syncing way to cut off access.)
            - No Cloudflare changes needed — just update every station to this version and your team lines up on all of them.

            **From v1.4.3 — a Registration role + a simpler record export**
            - **New "Registration" staff role.** Add a front-desk person under Admin → Staff & roles → Add staff → **Registration**. They sign in to a simple dashboard with one job: **Start patient check-in**. Each check-in they run drops straight into the vitals queue like any other. They can see the day's queue but can't open charts, change records, or reach any admin/clinical screen. After a check-in finishes they land right back on the dashboard — no re-typing a password between patients.
            - **Streamlined record export.** The patient record screen had a wall of eight near-identical export buttons. It's now one clear **Save record PDF** button (plus **Email to patient** when there's an address on file); Progress note, Patient summary, Print, Preview, Screen-display, and Save-to-USB all tuck into a **"More options"** drawer. Same for the dentist's signed-off export panel.

            **From v1.4.2 — consistent info across screens + simpler stations**
            - **Blood-thinner fix.** The patient's blood-thinner status now reads the SAME on every screen and in the PDF. If a thinner is in the med list OR the patient checked "takes blood thinners" at check-in, it's flagged everywhere — and if the EMT answered "No" while the history says yes, the app now shows a clear **"verify before extraction"** warning instead of a contradictory "No." (Fixes the case where the red flag said "takes blood thinners" but the line above said "No.")
            - **Safety: nothing hidden.** A typed-in "Other" allergy or condition (e.g. "Sulfa") now shows on the EMT/dentist/records screens — previously it only appeared in one PDF.
            - **Edits carry through.** A chief-complaint change made by the dentist now shows in Records and the patient history, not just the queues. "Checked out" is now worded the same everywhere.
            - **Simpler stations.** Each of the **EMT, Dentist, and Check-Out** screens now has ONE obvious primary button (Sign off & send / Mark visit complete / Verify & dismiss); less-used actions (lock, transfer, extra PDFs, USB tools) are tucked into a "More options" area. Removed a duplicate blood-thinner question on the EMT screen that could disagree with the main one.

            **From v1.4.0 — tidier menu + an admin Management console**
            - **Collapsible sidebar.** The stations (Vitals, Cleanings, Dentist, Check-Out, Records, Reports) now live under a **Clinic** module you click to open, and system settings under an **Admin** module — so the menu isn't a long wall of items. Dashboard stays pinned at the top; your open/closed choice is remembered.
            - **Events moved into Admin; Languages removed** (language packs are still chosen per event under Admin → Events → Edit).
            - **New: Admin → Management.** A live, cloud-synced overview of every patient where an admin can **override the flow** — send a patient back to vitals, re-route them to the dentist or hygienist, **re-open a finished record to edit it**, check someone out, or remove a bad record. It also shows the cloud connection and can open the server's status page so you can confirm everything's connected.

            **From v1.3.1 — cloud sync hardening**
            - Bullet-proofed the multi-device sync against rare race conditions: two stations editing at the very same moment now resolve to the same result on every device (no silent disagreement), a busy first sync can never skip a record, and a record whose linked patient hasn't arrived yet is safely retried instead of stalling the sync. Everyday syncing is unchanged — this just closes the tiny edge cases. Nothing to do but update.

            **From v1.3.0 — cleaner navigation + a big reliability pass**
            - **Sidebar modules.** The menu is now grouped into **Clinic** (Dashboard, Vitals, Cleanings, Dentist, Check-Out, Records, Reports, Events, Languages) and **Admin** (Staff & roles, Cloud, Backup & Export, Audit log). Everything that used to be buried in the crowded "Admin" tabbed screen is now its own clean, one-click page.
            - **Safety fix:** a blood-thinner detected in a patient's medication list now **always** raises the alert on the dentist's chart — even if the EMT answered "no" to the blood-thinner question (with a discrepancy note).
            - **No more getting kicked out of a chart:** cloud sync no longer refreshes the queue out from under a clinician who has a patient's chart open.
            - **Records fix:** the checkout/records/full-record PDFs now reliably include x-rays and all EMT vitals; USB check-out no longer downgrades a completed visit; a stray "null" on the empty Check-Out screen is gone.
            - **Robustness:** a single bad synced record can no longer break a station's patient list; patient names can't be blanked by an edit; recording the EMT's yes/no review no longer risks wiping vitals; plus a dozen smaller fixes across sign-in, reports, and admin.

            **From v1.2.4 — patients show up on every device**
            - **Cross-device fix.** A patient added on one computer now appears in the queue on **every** other computer, as it should. Previously each computer quietly used its own separate clinic event, so a synced patient was saved but hidden from the other stations' queues. All devices now share **one clinic** automatically.
            - Nothing to do — just update every station to this version and they'll line up on the same shared queue. (Existing patients re-sync automatically.)

            **From v1.2.3 — cloud is now on automatically, no setup**
            - **Always online out of the box.** Every station now connects to the clinic cloud automatically — the queue syncs across all devices with **zero setup**. No URLs, no keys, no "enable sync" — it just works.
            - **One simple switch.** Admin → Cloud is now a single control: **the clinic is Online**, or flip it to **Run offline** if a location has no wifi. Offline still works fully and re-syncs automatically the moment you turn it back on.
            - No more sync configuration to fuss with.

            **From v1.2.2 — a professional new sign-in screen**
            - Redesigned staff **sign-in** as a clean two-panel screen: a branded Caring Hands hero on the left and the sign-in form on the right.
            - New **"Remember me on this device"** — the app remembers your Company ID / username (never your password) so you don't retype it next time.
            - Patient **check-in** is still one tap away from the sign-in screen. Nothing about how you sign in changed — same accounts, same passwords.

            **From v1.2.1 — patients just move through, no forced sign-off/lock**
            - **No more mandatory "sign off & lock" between stations.** The provider (and hygienist) now have a simple **"Mark visit complete"** button that sends the patient to check-out — the record stays editable, nothing is frozen. Locking is still available as an **optional** "Sign off & lock" if you want a finalized, read-only record, but it's never required.
            - **Check-out no longer waits on a lock.** A patient can be verified and dismissed once their visit is marked complete (or even while still in progress) — no "provider must lock the record first" blocker. The only guard left: a patient can't be checked out before the EMT/nurse has seen them.

            **From v1.2.0 — clinical workflow upgrades from clinic feedback**
            - Check-in: no patient-entered vitals, "None of the above" for allergies/conditions/meds, patient picks Dentist or Hygienist, optional signature.
            - Stage-gated queue (EMT → dentist/hygienist), transfer between them, yes/no EMT review, vitals reliably attached to the record/PDF, quick-pick tooth numbers, lidocaine by carpules + tooth, x-ray attach by file or drag-drop, fixed hygienist tooth chart, and check-out email-the-summary.

            Includes everything from v1.0.2–1.1.1 (optional Cloud Sync, triage-free flow, per-event staff, Oregon consent, USB workflow, accountability, Russian, in-app auto-update).

            - **Caring-Hands-Setup-1.5.25.exe** — installer (recommended; required for auto-update).
            - **Caring-Hands-Portable-1.5.25.exe** — portable (no auto-update).

            First sign-in: `admin / admin` — then create your staff accounts. All clinical data stays on the device unless you enable Cloud Sync.
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
