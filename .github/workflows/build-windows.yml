name: Build Windows App

on:
  push:
    branches:
      - claude/confident-cori-tzj1sg
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer + portable exe
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        shell: bash
        run: ls -la release/ || dir release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Caring-Hands-Windows
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0-build.${{ github.run_number }}
          name: Caring Hands v1.2.0 (build ${{ github.run_number }})
          prerelease: false
          make_latest: true
          body: |
            ## Caring Hands Worldwide — Practice Management Software (v1.2.0)

            Offline-first dental clinic app for Windows. **Download the installer once — it auto-updates from here on.**

            **New in v1.2.0 — clinical workflow upgrades from clinic feedback**
            - **Check-in** — patients no longer enter vitals (the nurse does). Allergies, conditions, and medications now have a **"None of the above"** so a reviewed section is never mistaken for a skipped one. At the end the patient picks **who they want to see today — Dentist or Hygienist**. Signature is now optional (stylus/touch or leave blank).
            - **Stage-gated queue** — after check-in a patient shows up **only at the EMT/nurse station**. Once the nurse takes vitals and signs off, they move into the **right clinical queue** (dentist or hygienist) based on the check-in choice. A patient can be **transferred** dentist↔hygienist if needed.
            - **EMT/Nurse** — a yes/no medical-review checklist, and a **fix so vitals + the review reliably attach to the patient's record and PDF** (they were being dropped from the summary before). Export a patient's summary PDF straight from the list.
            - **Provider charting** — **quick-pick tooth numbers** (no more typing), **lidocaine tracked by carpules + tooth number**, separate fillings/extractions notes, and quadrant charting. Blood-thinner alert now reflects the nurse's answer. Record locks on sign-off.
            - **X-ray** — attach an x-ray image to the record at the doctor's station by picking a file **or dragging it onto the chart**; it's included in the summary.
            - **Hygienist** — the tooth chart is **fixed** (full-size, no longer squeezed into the corner).
            - **Check-out** — printable patient summary, plus an **email-the-summary** option for patients who give an email, and verify-and-dismiss.

            Includes everything from v1.0.2–1.1.1 (optional Cloud Sync, triage-free flow, brand refresh, per-event staff, Oregon consent, USB workflow, accountability, Russian, in-app auto-update).

            - **Caring-Hands-Setup-1.2.0.exe** — installer (recommended; required for auto-update).
            - **Caring-Hands-Portable-1.2.0.exe** — portable (no auto-update).

            First sign-in: `admin / admin` — then create your staff accounts. All clinical data stays on the device unless you enable Cloud Sync.
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
