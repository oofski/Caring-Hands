name: Build Windows App

on:
  push:
    branches:
      - claude/confident-cori-tzj1sg
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer + portable exe
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        shell: bash
        run: ls -la release/ || dir release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Caring-Hands-Windows
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.9-build.${{ github.run_number }}
          name: Caring Hands v1.0.9 (build ${{ github.run_number }})
          prerelease: false
          make_latest: true
          body: |
            ## Caring Hands Worldwide — Practice Management Software (v1.0.9)

            Offline-first dental clinic app for Windows. **Download the installer once — it auto-updates from here on.**

            **New in v1.0.9 — a simpler clinic flow: the triage station is gone**
            - **New patient flow** — check-in → queue → **EMT/nurse station** (vitals + blood-thinner check) → the EMT **sends the patient to the Dentist or the Hygienist** (or both) → check-out. No more separate triage step.
            - **EMT routes patients** — right after recording vitals, the nurse picks where the patient goes next; the queue shows who still needs vitals and where everyone is headed.
            - **Dentist is the planning hub** — the dentist screen now owns the treatment plan: chief complaint, tooth chart, and the fillings & extractions panels are always front and center (no more sections hidden behind a triage checklist). Vitals and the blood-thinner answer from the EMT show right at the top.
            - **Hygienist queue is route-driven** — patients sent to the hygienist appear in the Cleanings queue automatically.
            - **Legacy accounts keep working** — existing front-desk (triage) logins now open the EMT station; nobody loses access on update.

            Includes everything from v1.0.2–1.0.8 (brand refresh, hygienist workflow, per-event staff, blood-thinner alerts, Oregon consent, patient summary PDF, USB workflow, accountability, Russian, in-app auto-update).

            - **Caring-Hands-Setup-1.0.9.exe** — installer (recommended; required for auto-update).
            - **Caring-Hands-Portable-1.0.9.exe** — portable (no auto-update).

            First sign-in: `admin / admin` — then create your staff accounts. All clinical data stays on the device.
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
