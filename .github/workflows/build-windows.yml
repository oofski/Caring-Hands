name: Build Windows App

on:
  push:
    branches:
      - claude/confident-cori-tzj1sg
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer + portable exe
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        shell: bash
        run: ls -la release/ || dir release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Caring-Hands-Windows
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.1-build.${{ github.run_number }}
          name: Caring Hands v1.5.1 (build ${{ github.run_number }})
          prerelease: false
          make_latest: true
          body: |
            ## Caring Hands Worldwide — Practice Management Software (v1.5.1)

            Offline-first dental clinic app for Windows. **Download the installer once — it auto-updates from here on.**

            **New in v1.5.1 — the DEXIS X-ray import, made dead-simple**
            - **Reads DEXIS files directly and converts them to JPEG.** You no longer have to export a JPG by hand. Caring Hands reads the DEXIS **`.dex`** file straight from the folder, pulls the image out, and converts it to a **JPEG** for the chart automatically. *(If a particular `.dex` is a fully proprietary format with no standard image inside, it's clearly flagged and you can fall back to DEXIS's Export-as-JPEG — we never attach an unreadable image.)*
            - **Set up once, then hidden.** At the start of the day, whoever sets up the X-ray computer picks the folder **once** and **locks** it. After that the dentist only ever sees a single **Import X-ray** button — no folder pickers, no confusion.
            - **A clean, center-screen popup.** Tapping Import opens a modern wizard that shows the X-ray **one at a time**, asks just two quick questions — **which tooth?** and **which area/quadrant?** — shows the auto-name live, and files it. A little filmstrip lets you flip through several captures.
            - **Auto-names and auto-files.** Each image is named **`Lastname_Firstname_<area>_T<tooth>.jpg`** from your answers, attached to the patient, printed on the record, and synced to every laptop. You can re-assign the tooth later by clicking it.
            - **Keeps the folder clean.** After an image is filed to the chart, Caring Hands **removes it from the folder** (a setting you can turn off), so the next patient's captures are never mixed up with the last patient's.

            **From v1.5.0 — X-rays in the patient chart**
            - The dentist's Treat screen gained the **X-ray panel** with tooth assignment, auto-naming, PDF printing, and cross-laptop sync — v1.5.1 makes the DEXIS import for it effortless.

            **From v1.4.10 — check-in form updates**
            - **"What do you need today?" scale.** The dental step asks what the patient needs on a simple **1–4 slider** (slide or tap a number): **1 = Extraction (in pain), 2 = Extraction (no pain), 3 = Filling, 4 = Dental cleaning** — replacing the old yes/no "are you in pain?" question. Choosing **1 or 2 (extraction)** automatically adds the **Oral Surgery consent**, so it's captured whenever an extraction is expected. The choice shows on the dentist's chart and the record.
            - **Trimmed questions.** Removed **"Children by age group,"** **"Your long-term dental goals,"** and **"Interested in cosmetic improvements?"** from check-in — and from every screen and the printed record.
            - **Required answers.** **Medication allergies, medical conditions,** and **current medications** must now be answered at check-in (pick an option, "Other," or "None of the above" / "No medications") before the patient can continue.

            **From v1.4.8 — updated check-in allergy list**
            - The medication-allergy options at check-in now list **Lidocaine** and **Articaine** (the anesthetics actually used) instead of **Novocain**. Any older record that recorded a Novocain allergy still shows it — it's just no longer offered as a new choice.

            **From v1.4.7 — updated consent forms, chairside consent, and a few clinical fixes**
            - **Complete consent wording.** The General consent and the Oral Surgery consent now use the full, updated wording (the oral-surgery form includes the post-op / after-hours call instructions and hold-harmless). Read-aloud still works. Spanish and the other languages keep their existing translations; the new wording is the English authoritative text.
            - **Complete a consent at the dentist's chair.** The dentist's Treat screen now shows a **Consents** card right under patient history. If a patient wanted a filling but the dentist recommends an extraction, the dentist can have the patient complete the **Oral Surgery consent right there** — enter the tooth number(s), have the patient sign, done. (Also works for capturing a General consent if one is somehow missing.)
            - **General consent required before treatment.** The dentist can't document treatment until the General consent is on file. Every check-in already captures it, so nothing changes for normal visits; if it's ever missing, the Consents card lets the patient complete it first.
            - **Phone numbers accept up to 10 digits** (digits only) at check-in and when editing a record. It's a cap, not a required length, so shorter local numbers still work.
            - **High blood pressure — record re-checks.** When a reading is over 180/100, the vitals station lets you record **up to two more BP readings**. They show on the dentist's screen and print on the record (each in red if still high).

            **From v1.4.6 — the active event now syncs across laptops**
            - **Fix: setting the clinic event carries to every computer.** Choosing an event under **Admin → Events → Set active** used to only change *that* computer, so laptops could sit on different events and split the patient queue. Now the selection syncs: set the event on one laptop and every other laptop switches to the **same** event automatically, so new check-ins and the queue line up everywhere. If two people pick different events at once, the most recent choice wins on all laptops. (Turning an event off, or creating brand-new events, syncs the same way.)
            - Nothing to configure — just update every station and pick your event once.

            **From v1.4.5 — high blood pressure is flagged red**
            - A blood-pressure reading now turns **red** the moment it hits hypertensive-crisis levels — **systolic over 180 or diastolic over 100**. At the EMT/vitals station the offending field goes red as you type and a clear warning appears; the dentist's handoff strip and the printed record show the reading in red too. Exactly 180/100 is not flagged (only readings *over* the threshold are).

            **From v1.4.4 — staff accounts now sync across every laptop**
            - **Fix: your team syncs.** Staff accounts you create — including which event they're scoped to — used to live only on the laptop that created them. They now sync to **every** laptop on the clinic cloud, just like the patient queue. Create a dentist, hygienist, check-out, or registration account on one computer and they can sign in on all of them, with the same password and the same event scoping.
            - **One shared admin.** Every laptop ships with the same built-in `admin` account; those now converge to a single shared identity instead of colliding. If you set a real admin password on one laptop, that password propagates to the others — and a freshly-installed laptop's default `admin/admin` can never overwrite the password you already set.
            - To revoke someone across all laptops, **disable** their account (Admin → Staff → Disable) — that change syncs everywhere. (As with patient records, deleting on one laptop doesn't erase them elsewhere; disable is the reliable, syncing way to cut off access.)
            - No Cloudflare changes needed — just update every station to this version and your team lines up on all of them.

            **From v1.4.3 — a Registration role + a simpler record export**
            - **New "Registration" staff role.** Add a front-desk person under Admin → Staff & roles → Add staff → **Registration**. They sign in to a simple dashboard with one job: **Start patient check-in**. Each check-in they run drops straight into the vitals queue like any other. They can see the day's queue but can't open charts, change records, or reach any admin/clinical screen. After a check-in finishes they land right back on the dashboard — no re-typing a password between patients.
            - **Streamlined record export.** The patient record screen had a wall of eight near-identical export buttons. It's now one clear **Save record PDF** button (plus **Email to patient** when there's an address on file); Progress note, Patient summary, Print, Preview, Screen-display, and Save-to-USB all tuck into a **"More options"** drawer. Same for the dentist's signed-off export panel.

            **From v1.4.2 — consistent info across screens + simpler stations**
            - **Blood-thinner fix.** The patient's blood-thinner status now reads the SAME on every screen and in the PDF. If a thinner is in the med list OR the patient checked "takes blood thinners" at check-in, it's flagged everywhere — and if the EMT answered "No" while the history says yes, the app now shows a clear **"verify before extraction"** warning instead of a contradictory "No." (Fixes the case where the red flag said "takes blood thinners" but the line above said "No.")
            - **Safety: nothing hidden.** A typed-in "Other" allergy or condition (e.g. "Sulfa") now shows on the EMT/dentist/records screens — previously it only appeared in one PDF.
            - **Edits carry through.** A chief-complaint change made by the dentist now shows in Records and the patient history, not just the queues. "Checked out" is now worded the same everywhere.
            - **Simpler stations.** Each of the **EMT, Dentist, and Check-Out** screens now has ONE obvious primary button (Sign off & send / Mark visit complete / Verify & dismiss); less-used actions (lock, transfer, extra PDFs, USB tools) are tucked into a "More options" area. Removed a duplicate blood-thinner question on the EMT screen that could disagree with the main one.

            **From v1.4.0 — tidier menu + an admin Management console**
            - **Collapsible sidebar.** The stations (Vitals, Cleanings, Dentist, Check-Out, Records, Reports) now live under a **Clinic** module you click to open, and system settings under an **Admin** module — so the menu isn't a long wall of items. Dashboard stays pinned at the top; your open/closed choice is remembered.
            - **Events moved into Admin; Languages removed** (language packs are still chosen per event under Admin → Events → Edit).
            - **New: Admin → Management.** A live, cloud-synced overview of every patient where an admin can **override the flow** — send a patient back to vitals, re-route them to the dentist or hygienist, **re-open a finished record to edit it**, check someone out, or remove a bad record. It also shows the cloud connection and can open the server's status page so you can confirm everything's connected.

            **From v1.3.1 — cloud sync hardening**
            - Bullet-proofed the multi-device sync against rare race conditions: two stations editing at the very same moment now resolve to the same result on every device (no silent disagreement), a busy first sync can never skip a record, and a record whose linked patient hasn't arrived yet is safely retried instead of stalling the sync. Everyday syncing is unchanged — this just closes the tiny edge cases. Nothing to do but update.

            **From v1.3.0 — cleaner navigation + a big reliability pass**
            - **Sidebar modules.** The menu is now grouped into **Clinic** (Dashboard, Vitals, Cleanings, Dentist, Check-Out, Records, Reports, Events, Languages) and **Admin** (Staff & roles, Cloud, Backup & Export, Audit log). Everything that used to be buried in the crowded "Admin" tabbed screen is now its own clean, one-click page.
            - **Safety fix:** a blood-thinner detected in a patient's medication list now **always** raises the alert on the dentist's chart — even if the EMT answered "no" to the blood-thinner question (with a discrepancy note).
            - **No more getting kicked out of a chart:** cloud sync no longer refreshes the queue out from under a clinician who has a patient's chart open.
            - **Records fix:** the checkout/records/full-record PDFs now reliably include x-rays and all EMT vitals; USB check-out no longer downgrades a completed visit; a stray "null" on the empty Check-Out screen is gone.
            - **Robustness:** a single bad synced record can no longer break a station's patient list; patient names can't be blanked by an edit; recording the EMT's yes/no review no longer risks wiping vitals; plus a dozen smaller fixes across sign-in, reports, and admin.

            **From v1.2.4 — patients show up on every device**
            - **Cross-device fix.** A patient added on one computer now appears in the queue on **every** other computer, as it should. Previously each computer quietly used its own separate clinic event, so a synced patient was saved but hidden from the other stations' queues. All devices now share **one clinic** automatically.
            - Nothing to do — just update every station to this version and they'll line up on the same shared queue. (Existing patients re-sync automatically.)

            **From v1.2.3 — cloud is now on automatically, no setup**
            - **Always online out of the box.** Every station now connects to the clinic cloud automatically — the queue syncs across all devices with **zero setup**. No URLs, no keys, no "enable sync" — it just works.
            - **One simple switch.** Admin → Cloud is now a single control: **the clinic is Online**, or flip it to **Run offline** if a location has no wifi. Offline still works fully and re-syncs automatically the moment you turn it back on.
            - No more sync configuration to fuss with.

            **From v1.2.2 — a professional new sign-in screen**
            - Redesigned staff **sign-in** as a clean two-panel screen: a branded Caring Hands hero on the left and the sign-in form on the right.
            - New **"Remember me on this device"** — the app remembers your Company ID / username (never your password) so you don't retype it next time.
            - Patient **check-in** is still one tap away from the sign-in screen. Nothing about how you sign in changed — same accounts, same passwords.

            **From v1.2.1 — patients just move through, no forced sign-off/lock**
            - **No more mandatory "sign off & lock" between stations.** The provider (and hygienist) now have a simple **"Mark visit complete"** button that sends the patient to check-out — the record stays editable, nothing is frozen. Locking is still available as an **optional** "Sign off & lock" if you want a finalized, read-only record, but it's never required.
            - **Check-out no longer waits on a lock.** A patient can be verified and dismissed once their visit is marked complete (or even while still in progress) — no "provider must lock the record first" blocker. The only guard left: a patient can't be checked out before the EMT/nurse has seen them.

            **From v1.2.0 — clinical workflow upgrades from clinic feedback**
            - Check-in: no patient-entered vitals, "None of the above" for allergies/conditions/meds, patient picks Dentist or Hygienist, optional signature.
            - Stage-gated queue (EMT → dentist/hygienist), transfer between them, yes/no EMT review, vitals reliably attached to the record/PDF, quick-pick tooth numbers, lidocaine by carpules + tooth, x-ray attach by file or drag-drop, fixed hygienist tooth chart, and check-out email-the-summary.

            Includes everything from v1.0.2–1.1.1 (optional Cloud Sync, triage-free flow, per-event staff, Oregon consent, USB workflow, accountability, Russian, in-app auto-update).

            - **Caring-Hands-Setup-1.5.1.exe** — installer (recommended; required for auto-update).
            - **Caring-Hands-Portable-1.5.1.exe** — portable (no auto-update).

            First sign-in: `admin / admin` — then create your staff accounts. All clinical data stays on the device unless you enable Cloud Sync.
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
