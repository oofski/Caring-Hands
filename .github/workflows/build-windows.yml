name: Build Windows App

on:
  push:
    branches:
      - claude/confident-cori-tzj1sg
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer + portable exe
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        shell: bash
        run: ls -la release/ || dir release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Caring-Hands-Windows
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8-build.${{ github.run_number }}
          name: Caring Hands v1.0.8 (build ${{ github.run_number }})
          prerelease: false
          make_latest: true
          body: |
            ## Caring Hands Worldwide — Practice Management Software (v1.0.8)

            Offline-first dental clinic app for Windows. **Download the installer once — it auto-updates from here on.**

            **New in v1.0.8 — cleaner clinical screens & blood-thinner check**
            - **Tidier EMT screen** — patient health history is now a collapsible dropdown instead of a wall of cards, and the stray "null" is gone. Record vitals, then the app prompts you to confirm with the patient whether they're on any blood thinners.
            - **Blood-thinner confirmation** — the EMT's answer is saved and shown as a clear alert across the clinical screens (critical before any extraction).
            - **Click a patient anywhere** — on the Vitals, Cleanings, and Check-Out lists you can now click the whole row (including the name) to open the patient.
            - **Condensed health history** — the always-open history is collapsed into a neat dropdown on the clinical screens.
            - **Role-aligned charting** — the doctor's tooth chart offers fillings and extractions; the hygienist's offers cleaning. Both keep the full odontogram.

            Includes everything from v1.0.2–1.0.7 (brand refresh, hygienist workflow, per-event staff, EMT vitals, Check-Out, Oregon consent, patient summary PDF, USB workflow, accountability, Russian, in-app auto-update).

            - **Caring-Hands-Setup-1.0.8.exe** — installer (recommended; required for auto-update).
            - **Caring-Hands-Portable-1.0.8.exe** — portable (no auto-update).

            First sign-in: `admin / admin` — then create your staff accounts. All clinical data stays on the device.
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
