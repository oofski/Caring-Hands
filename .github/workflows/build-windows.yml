name: Build Windows App

on:
  push:
    branches:
      - claude/confident-cori-tzj1sg
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer + portable exe
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        shell: bash
        run: ls -la release/ || dir release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Caring-Hands-Windows
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2-build.${{ github.run_number }}
          name: Caring Hands v1.0.2 (build ${{ github.run_number }})
          prerelease: true
          body: |
            ## Caring Hands Worldwide — Practice Management Software (v1.0.2)

            Offline-first dental clinic app for Windows. Download an installer below and run it.

            **New in v1.0.2**
            - **Click-to-tag odontogram** — tap a tooth to tag Filling / Extraction / Cleaning + a short note; auto-fills the treatment lists (minimal typing). Dentition **dropdown**: Adult / Primary / **Mixed**. Cleaner tooth-number pills.
            - **Patient intake fixed** — a latent bug meant intake fields weren't captured; demographics, medical, dental, and consents now flow correctly into Triage / Provider / Records.
            - **Records** now shows patients across **all events** with an event filter; admins can **delete** patients.
            - **Admin** can **deactivate / reactivate / edit / delete** clinic events, and **delete** staff.
            - **Reports** overhaul — daily breakdown + redesigned patients-by-status view.
            - **Language** chosen on a pre-start gate; **Belizean Kriol** and **Nyanja** packs added (selectable per event).
            - Home screen no longer shows demo credentials; only a bootstrap **admin** exists — the admin creates all staff.

            - **Caring-Hands-Setup-1.0.2.exe** — standard installer (creates Start-menu + desktop shortcuts).
            - **Caring-Hands-Portable-1.0.2.exe** — portable, runs without installing (good for USB sticks).

            First sign-in: `admin / admin` — then create your staff accounts. All data stays on the device — no cloud, fully offline.
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
