name: Build Windows App

on:
  push:
    branches:
      - claude/confident-cori-tzj1sg
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer + portable exe
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        shell: bash
        run: ls -la release/ || dir release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Caring-Hands-Windows
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.7-build.${{ github.run_number }}
          name: Caring Hands v1.0.7 (build ${{ github.run_number }})
          prerelease: false
          make_latest: true
          body: |
            ## Caring Hands Worldwide — Practice Management Software (v1.0.7)

            Offline-first dental clinic app for Windows. **Download the installer once — it auto-updates from here on.**

            **New in v1.0.7 — brand refresh, hygienist workflow & per-event staff**
            - **New brand look** — the whole app now follows the official Caring Hands Brand Standards: Teal + Navy palette with a single Coral accent, Montserrat headings and Open Sans body text (bundled, fully offline), and the tagline "Helping hands for healthy living".
            - **Hygienist role & screen** — cleanings now have their own focused station. Triage routes cleaning patients to the hygienist; extractions and fillings go to the doctor.
            - **Doctor screen decluttered** — the provider chart now leads with the treatment the patient actually needs (extraction/filling); cleaning and reference panels are tucked into collapsible sections.
            - **Staff per event** — create staff for the current event, then "Start fresh for the next event" to clear them out in one click. Administrators are always kept, so you never lock yourself out.
            - **Updates never disable your team** — installing a new version always preserves your existing staff and their access; enabling a role keeps it enabled.

            Includes everything from v1.0.2–1.0.6 (EMT vitals, Check-Out, blood-thinner alerts, Oregon consent, patient summary PDF, USB workflow, accountability, Russian, in-app auto-update).

            - **Caring-Hands-Setup-1.0.7.exe** — installer (recommended; required for auto-update).
            - **Caring-Hands-Portable-1.0.7.exe** — portable (no auto-update).

            First sign-in: `admin / admin` — then create your staff accounts. All clinical data stays on the device.
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
