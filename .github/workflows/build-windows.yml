name: Build Windows App

on:
  push:
    branches:
      - claude/confident-cori-tzj1sg
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned to windows-2022 (Visual Studio 2022). "windows-latest" rolled to a
    # newer image whose Visual Studio 18 isn't recognized by node-gyp, which
    # broke the native better-sqlite3 build during npm install.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer + portable exe
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        shell: bash
        run: ls -la release/ || dir release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Caring-Hands-Windows
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable release
        id: publish
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.10.1-build.${{ github.run_number }}
          name: Caring Hands v1.10.1 (build ${{ github.run_number }})
          prerelease: false
          make_latest: true
          body: |
            ## Caring Hands Worldwide — Practice Management Software (v1.10.1)

            Offline-first dental clinic app for Windows. **Download the installer once — it auto-updates from here on.**

            **New in v1.10.1 — the dashboard works for whoever is signed in**

            - **Fixed: everyone except an administrator was shown a sidebar containing only "Dashboard".** The Clinic and Admin menus start collapsed, and everyone lands on the Dashboard — which is in neither menu — so nothing ever expanded them. A hygienist's only screen, **Cleanings**, was hidden behind a closed menu they had no reason to suspect; the same was true of **Arrivals** for the front desk, **Vitals** for the EMT, and **Check-Out**. The menus now start open, and if you collapse one it stays collapsed on that computer.
            - **New: clinicians see their own queue first.** The dashboard tiles count the whole clinic, so "Ready for treatment" included the dentist's patients — a number that told a hygienist nothing about their own chair. A **Waiting for you** tile now leads the row for the dentist and the hygienist, counting only the patients routed to them, and opens their station. Administrators still see the clinic-wide view.
            - Tiles for a station the signed-in role cannot open are no longer clickable, so nothing on the dashboard leads to a "you do not have access" message.

            *No clinic-server update is needed for this release — the server is still v1.9.0.*
            **From v1.10.0 — three things the clinic asked for**

            - **The hygienist can now see blood pressure.** Their screen showed no vitals at all — not the blood pressure, not the heart rate, not whether the patient is on a blood thinner. Those are exactly what decides whether it is safe to scale someone, and the dentist has always had them. Both screens now read from one shared panel, so they can never drift apart again.
            - **A returning patient can now sign their consent.** Starting a new visit for someone seen before correctly asks for a fresh consent — but nothing anywhere could take one. The front desk could not, and the dentist's chair (the only screen that could) sat behind the very check that was blocking them. **A returning patient could not be seen at all.** The front desk can now take the consent on the Arrivals screen, where the patient is actually standing, and the "They're here" button says plainly that it is needed first.
            - **Notes can be added to a finished visit, and a finished visit can be re-opened.** Once a visit was completed the patient dropped off the clinician's screen with no way back, and a signed-off record refused every change. Now: **Add a note** puts a new note beside the original — it works even on a locked record, and records who wrote it and when, exactly as a paper chart would. **Re-open to correct** unlocks the record and puts the patient back in the queue, for when what was written is wrong rather than merely incomplete. Both the dentist and the hygienist have a **Finished today** list so a completed patient can be opened again. Notes added afterwards appear at check-out and print on the patient's record.

            *One more thing found while building this:* the chairside consent dialog said the signature was optional, while the rule that decides whether a consent counts requires a real one. A consent taken at the chair could therefore look saved and still leave the patient blocked — and print as NOT SIGNED. The signature is now required there too, which is what the check-in screen and the online form have both done since v1.7.0.

            *No clinic-server update is needed for this release — the server is still v1.9.0.*
            **From v1.9.0 — several clinics can take sign-ups at once**

            *The new switch*
            - **Each clinic now has its own Online sign-ups switch**, separate from which clinic is live. Admin → Events has a new **Online sign-ups** column showing **Open** or **Closed** for every clinic, with one button to change it and one to show the link.
            - **Only one clinic is ever the live clinic** — the one walk-ins are filed into — exactly as before. Opening or closing a pre-registration link never changes that, and switching the live clinic never changes any link.
            - **A patient always lands in the clinic whose link they used.** Someone signing up through the Spring clinic link is filed to the Spring clinic even while the Autumn clinic is the one running today.
            - **A closed link says so.** Patients see "this clinic is not taking online sign-ups right now" naming the clinic — not the "link not found" page, which means something entirely different and sent us chasing the wrong problem once before.
            - **A form already open in a browser tab cannot slip a submission through** after the link closes; it is checked again on submit.
            - **Finishing a clinic closes its own link**, so nobody registers into a clinic that is over and nobody is watching. It leaves every other clinic alone, and an admin can reopen it in one click.
            - **Clinics you have not touched stay open.** Anything that existed before this release keeps working exactly as it did, including while some of your laptops are still on an older version.

            *The clinic flow, checked end to end*
            The whole path — check-in → vitals → dentist or hygienist → check-out — was walked against the real database, asserting the rules between stations rather than just that each screen loads. **No faults were found.** Confirmed working, and now covered by permanent tests so it stays that way:
            - No vitals means no clinician, on both the dentist and hygienist branches.
            - An unsigned patient cannot reach a clinician, and an admin override cannot walk them past it either.
            - An extraction visit is refused until the oral-surgery consent is signed; a filling or cleaning is not asked for one. The online form and the front desk agree on what counts as an extraction.
            - A patient the EMT has never seen cannot be checked out.
            - Check-out records who checked the patient out and when.
            - Sending a patient back to vitals undoes the sign-off but **keeps their recorded vitals** — those are clinical facts, not workflow state.
            - Nobody disappears between stations, and the dashboard counts everyone.

            **⚠️ This release needs the clinic server refreshed (now v1.9.0)** — the same one-time paste your admin has done before. Until it is pasted, every pre-registration link stays open regardless of the switch. Nothing else in this release depends on it.
            **From v1.8.0 — the interface, redone**
            The whole app was walked through screen by screen at two laptop sizes. Six things were genuinely broken; the rest is a rebuilt look that applies everywhere at once.

            *Things that were broken*
            - **Fixed: the Reports screen printed the word `null`** under its heading, on every clinic with no kept totals. Harmless, but it looked like something had crashed. The underlying cause could have put stray text on any screen, so it is fixed once, centrally, and covered by a test.
            - **Fixed: the last column of the patient-flow board was sliced off.** On a 1600px laptop the six stage columns were pinned too wide to fit, so **Checked out** — the column that tells you a patient is done — sat past the right edge with nothing to suggest it existed. The columns now share the width, and when they genuinely cannot fit, the edge fades so it is obvious there is more.
            - **Fixed: collapsed sections looked like dead headings.** `USB tools` on Check-Out and `At the hygienist` on the Dentist screen are expandable, but nothing on screen said so — no arrow, no hint. Every collapsible section now carries a chevron that turns as it opens.
            - **Fixed: two identical-looking search boxes on Records.** One filters the list in front of you; the other searches every clinic you have ever run. They were indistinguishable. The filter now sits in a labelled bar above the table, and the cross-clinic finder is a separate, named tool.
            - **Fixed: Management did not fit on a laptop screen.** Each of the eight rows carried six same-sized buttons; at 1280px the row wrapped three deep and the table ran off the edge of the pane. **Open** is now the one prominent action and the five station overrides are a single **Move to…** picker beside it. Nothing was removed — every destination is still one gesture away, and there is a test that proves each one still moves the patient.
            - **Fixed: a marketing tagline sat above the heading on 3 of the 14 screens** and nowhere else. Removed from the app; it still belongs on the sign-in screen.

            *The new look*
            - **Cards, dialogs and the page now sit on distinct layers** instead of every panel being the same flat grey box, so what matters looks like it matters.
            - **Card headings are readable sentences** rather than 11px shouted capitals.
            - **Everything clickable responds** — to the mouse, to a press, and to the keyboard, with a visible focus ring on every control. All of it backs off if the computer is set to reduce motion.
            - **Patient lists are easier to work**: taller rows, the heading stays put while you scroll a long queue, and the row under the cursor is marked so you can see which one you are about to open.
            - **Bigger targets on the patient-facing check-in screen** — taller boxes, a larger signature pad, and a progress bar visible from arm's length.
            - **Numbers line up** in every column that compares them.
            - On a large monitor the content **stays a readable width** instead of stretching a six-column table across the whole screen.

            *Nothing about how the app works changed*, apart from the Management picker above. Same accounts, same passwords, same flow, same data. **No clinic-server update is needed for this release — the server is still v1.7.2.**
            **From v1.7.3 — a full back-end audit: 13 bugs found and fixed**
            Every one of these was reproduced with a runnable script before it was fixed, and every one now has a regression test.

            *Data that was being destroyed*
            - **Fixed: “Finish clinic” followed by “Delete this clinic’s patient data” wiped the clinic’s report.** The totals were recounted against an empty clinic and overwritten with zeros — and the zeros were then pushed to every other computer. **This is the report loss originally reported**, reachable by that exact button order. A kept report is now a high-water mark: nothing can reduce it.
            - **Fixed: a backup made by an older version restored NOTHING.** The restore hit a database error partway and rolled the whole thing back — zero patients, zero consents, zero x-rays. This is the only way to get a clinic back after its data is removed, so it mattered enormously. Older backups now restore in full, charts included.
            - **Fixed: loading a patient from a USB stick could overwrite a completely different patient.** It matched on the *other* laptop’s internal row number, so an unrelated person’s name, date of birth and history were replaced. It now matches on the patient’s permanent id.
            - **Fixed: a REFUSED staff deletion still deleted the account everywhere else.** Deleting your own account (or the last administrator) was correctly refused on screen — but the deletion had already been published, so every other computer removed it on the next sync. An administrator could lock themselves out of every station with no visible error.

            *Patient safety and consent*
            - **Fixed: an unsigned patient could reach the dentist.** The consent check only existed on the Arrivals screen, and Arrivals can be skipped — the vitals station sent patients straight to a clinician without it. Every route is now gated, including an admin moving someone, and an extraction still requires the oral-surgery consent.
            - **Fixed: an unsigned consent printed as “Signed”.** The record now says **NOT SIGNED** and shows “No signature on file” where the signature belongs.
            - **Fixed: the shared front-desk and check-out logins were deleted by “Start fresh for next event”.** They were being quietly re-scoped to the current clinic on every launch, so the sweep took them with it and both stations lost their logins.

            *Records that went missing or disagreed between computers*
            - **Fixed: a patient’s chart could arrive blank on another computer.** A chart sent by a laptop on an older version was silently rejected and never retried — the patient appeared with no complaint, no vitals and no station. Charts now arrive complete.
            - **Fixed: after “Finish clinic” the app silently switched to a PREVIOUS clinic**, and the next walk-in was filed there. It now leaves no clinic open and says so plainly at check-in until you choose or create one.
            - **Fixed: one late patient made a whole clinic’s report read as 1.** A patient arriving after a clinic was finished — or a partial restore from backup — replaced the correct kept total with the handful of records on that computer.
            - **Fixed: two computers could permanently disagree** about a finished clinic’s figures. Each kept its own report and rejected the other’s, so the grant number depended on which laptop you read it from.
            - **Fixed: USB imports duplicated every consent** on a new record and **discarded** them on an existing one — including a chairside oral-surgery consent with its signature.
            - **Fixed: deleted shared logins kept reappearing** in the staff list after every restart.
            - **Fixed: the exported workbook reported a cleaning for patients who had not had one.**

            *No clinic-server update is needed for this release — the server is still v1.7.2.*

            **From v1.7.2 — a dead pre-registration link now tells you why**
            - **A link for a clinic that was DELETED now says so**, instead of the same “link not found” message shown when a link was simply never valid. Those are different problems with different fixes, and one message for both made a live incident far harder to diagnose than it should have been.
            - **New diagnostic:** `GET /v1/events` on the clinic server (clinic key required) lists every clinic the server holds, its current pre-registration link, and whether that link works. Clinic names and dates only — never patient data.
            - Deleting a clinic event in **Admin → Events** permanently kills its pre-registration link, because deletions are permanent across every computer by design. If you need a clinic's data gone but its link alive, use **Finish clinic** or **Delete this clinic's patient data** instead — both remove the records and keep the event.

            **From v1.7.1 — FIX: pre-registration links stopped working**
            - **Fixed: a live clinic's pre-registration link could show “This clinic has closed”.** v1.6.6 added a rule that shut the public link whenever the clinic event's `active` flag reached the cloud as off. That flag reflects whichever computer last pushed the event — so a clinic that had been finished, turned off, or had its data removed at any point in its history was enough to close the link for everyone, including a clinic running right now. The link is served again whenever the event exists. **A link that dies during a clinic is far worse than one that stays open after it**, so closing a link is going back to being a deliberate act rather than something a synced flag can do on its own.
            - Everything made required in v1.6.9 and v1.7.0 is unchanged and still enforced — phone, city and state, emergency contact and phone, what you need today, allergies, conditions, medications, every medical and dental history question, and a real signature on the consent (and on the oral-surgery consent for an extraction).
            - *This needs the clinic server refreshed (now v1.7.1). If your pre-registration links are showing “This clinic has closed”, this paste is the fix.*

            **From v1.7.0 — IMPORTANT: the signature is now real, on both paths**
            v1.6.9 made the two intake paths ask for the same things. A full audit of that claim then found the rule they *shared* was not actually the same rule — and the gap was in the signature.
            - **CRITICAL FIX: a single tap counted as a signature online.** On the pre-registration form, touching the signature box once — without drawing anything — produced a completely blank image that was accepted and filed as a signed consent. The same tap at the front desk was correctly refused. So a patient could arrive pre-registered, their record reading **“Signed”** on the roster and in Reports, with nothing but an empty box behind it. **This applied to the oral-surgery consent too**, meaning a dentist could reach the chair believing the extraction consent was on file. Signing online now requires an actual stroke, exactly as it always has at the desk.
            - **CRITICAL FIX: signing and then rotating your phone erased the signature — silently.** Resizing the page cleared the drawn signature but the form still reported it as signed, and submitted a blank image. The signature now survives a rotation, and if it ever cannot be recovered the form says it is unsigned rather than sending an empty one.
            - **The server now checks that a signature is genuinely an image.** It previously accepted any text that merely started with `data:image/png;base64,` — never opening it. It now decodes the image and verifies it before storing it.
            - **Fixed: the Spanish oral-surgery consent was a DIFFERENT DOCUMENT online than at the desk.** The online version was missing the post-operative care and emergency-contact paragraphs — and both versions were filed under the same version number, so records could not be told apart. The two now match word for word, and the corrected Spanish wording is filed as **v2** so anything signed under the old text stays identifiable.
            - **Under-18 patients:** the desk has always shown “a parent or guardian must sign”. The online form had no age check at all. It now shows the same notice and, on both paths, requires you to say **who** is signing.
            - **Fixed: a space in the City box passed the online form** and was only refused after the patient had signed both consents. Every check now trims, and takes the patient straight to the field it means instead of showing an error at the bottom of a long page.
            - **Fixed: pasting a phone number as “(503) 555-0199” silently lost the last four digits** — on both the online form and at the desk.
            - **Fixed: switching the form to Spanish threw away everything already entered**, including a drawn signature, with no warning. It now asks first.
            - **New: a test that compares the two paths directly.** Until now each side was tested in isolation, which is exactly how the Spanish consent drifted apart unnoticed. There is now a parity suite that reads both and fails if the required fields, the questions asked, or the consent wording ever diverge again.
            - *This needs the clinic server refreshed (now v1.7.0) — the same one-time paste your admin has done before. **Please do this one promptly:** until it is pasted, the online form can still accept a blank signature.*

            **Earlier releases**
            Every release from v1.0.2 to v1.6.9 — pre-registration, cloud sync, the reporting rebuild, the A–Z patient lists, per-event staff, the USB workflow and the rest — is listed with its full notes at
            https://github.com/oofski/Caring-Hands/releases

            - **Caring-Hands-Setup-1.10.1.exe** — installer (recommended; required for auto-update).
            - **Caring-Hands-Portable-1.10.1.exe** — portable (no auto-update).

            First sign-in: `admin / admin` — then create your staff accounts. All clinical data stays on the device unless you enable Cloud Sync.
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub's release-asset endpoint drops one large .exe every few runs
      # ("Error uploading" / "Error saving asset"), leaving the release a draft
      # with a file missing and failing the build even though the installers
      # were produced correctly — three runs in a row died that way.
      #
      # This re-uploads only the MISSING assets, with `gh`, which touches the
      # files and nothing else. Re-running the release action instead would
      # re-send the whole release and risk rewriting its notes.
      - name: Retry any dropped release assets
        if: steps.publish.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v1.10.1-build.${{ github.run_number }}"
          for attempt in 1 2 3; do
            missing=0
            for f in release/*.exe release/latest.yml release/*.blockmap; do
              [ -e "$f" ] || continue
              name=$(basename "$f")
              if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx "$name"; then
                echo "ok      $name"
              else
                echo "missing $name — uploading (attempt $attempt)"
                gh release upload "$tag" "$f" --clobber || missing=1
              fi
            done
            [ "$missing" -eq 0 ] && break
            echo "retrying in 20s"; sleep 20
          done
          # A failed publish leaves the release as an unpublished DRAFT, which
          # nobody can download. Once its files are all present, publish it.
          gh release edit "$tag" --draft=false --latest

      # The release is only usable if BOTH installers actually landed. Fail the
      # build loudly if one is missing, instead of leaving a half-published
      # release that looks green.
      - name: Verify both installers are on the release
        shell: bash
        run: |
          tag="v1.10.1-build.${{ github.run_number }}"
          api="https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag"
          json=$(curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$api")
          names=$(echo "$json" | grep -o '"name": *"[^"]*\.exe"' || true)
          echo "assets on $tag:"; echo "$names"
          echo "$names" | grep -q 'Caring-Hands-Setup' || { echo "::error::installer missing from the release"; exit 1; }
          echo "$names" | grep -q 'Caring-Hands-Portable' || { echo "::error::portable exe missing from the release"; exit 1; }
          # A draft is not downloadable, so a draft is not a release.
          echo "$json" | grep -q '"draft": *false' || { echo "::error::release is still a draft"; exit 1; }
          echo "both installers present and the release is published"

